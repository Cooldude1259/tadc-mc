            // Broken in 1.21.1

            exclude 'com/cooldude12/unnoficialtadc/client/CostumeBlockEntityRenderer.java'
            exclude 'com/cooldude12/unnoficialtadc/client/CostumeBlockEntityRenderState.java'
            exclude 'com/cooldude12/unnoficialtadc/client/CrownArmorRenderer.java'
            exclude 'com/cooldude12/unnoficialtadc/client/UNOFFICIALTADCMCClient.java'

            exclude 'com/cooldude12/unnoficialtadc/CostumeBlockEntity.java'
            exclude 'com/cooldude12/unnoficialtadc/CostumedGrassBlock.java'
            exclude 'com/cooldude12/unnoficialtadc/CostumedStoneBlock.java'
            exclude 'com/cooldude12/unnoficialtadc/CostumeItem.java'
            exclude 'com/cooldude12/unnoficialtadc/CostumeMap.java'
            exclude 'com/cooldude12/unnoficialtadc/CostumeRemoverItem.java'
            exclude 'com/cooldude12/unnoficialtadc/ModArmorMaterials.java'
            exclude 'com/cooldude12/unnoficialtadc/ModBlockEntities.java'
        }
    }
}